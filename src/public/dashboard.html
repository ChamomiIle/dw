<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>لوحة التحكم | وسيط الأمان</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --bg-dark: #090d16; --card-bg: #121826; --accent: #38bdf8; --text-main: #f8fafc; }
    body { background-color: var(--bg-dark); color: var(--text-main); font-family: 'Cairo', sans-serif; margin: 0; padding: 20px; }
    .dashboard-container { max-width: 1000px; margin: auto; }
    .welcome-banner { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(56, 189, 248, 0.15); }
    .btn-create { background: var(--accent); color: #000; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 700; border: none; cursor: pointer; }
    .ticket-card { background: var(--card-bg); padding: 20px; border-radius: 15px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #2d3748; }
    .empty-state { text-align: center; padding: 40px; color: #718096; font-weight: 700; }
    .section-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 15px; color: #fff; }
  </style>
</head>
<body>

  <div class="dashboard-container">
    <div class="welcome-banner">
      <h2 id="welcomeText">أهلاً بك...</h2>
      <a href="/index.html" class="btn-create">➕ فتح تذكرة جديدة</a>
    </div>

    <div class="section-title">📂 غرف الوساطة والتذاكر الخاصة بك</div>
    <div id="ticketsContainer">
      <div class="empty-state">جاري جلب بياناتك...</div>
    </div>
  </div>

  <script>
    const API_BASE = 'http://localhost:5001';

    window.onload = async function() {
      const token = localStorage.getItem('token') || localStorage.getItem('accessToken');
      const username = localStorage.getItem('username') || 'عزيزي المستخدم';

      if (!token) {
        window.location.href = '/index.html';
        return;
      }

      document.getElementById('welcomeText').innerText = `أهلاً بك يا ${username} 👋`;

      try {
        const res = await fetch(`${API_BASE}/api/tickets`, {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'x-auth-token': token,
            'Content-Type': 'application/json'
          }
        });

        const result = await res.json();
        const container = document.getElementById('ticketsContainer');
        
        if (res.ok) {
          const tickets = result.data || result.tickets || [];
          if (tickets.length === 0) {
            container.innerHTML = '<div class="empty-state">ليس لديك تذاكر حالياً.</div>';
          } else {
            container.innerHTML = '';
            tickets.forEach(ticket => {
              const ticketId = ticket._id || ticket.id;
              container.innerHTML += `
                <div class="ticket-card">
                  <div>
                    <h3 style="color: #fff; margin-bottom: 5px;">${ticket.title}</h3>
                    <p style="color: #94a3b8; font-size: 0.9rem;">المبلغ: $${ticket.amount} | الحالة: ${ticket.status || 'pending'}</p>
                  </div>
                  <button onclick="window.location.href='/ticket.html?id=${ticketId}'" class="btn-create" style="background:#0284c7; color:#fff;">دخول للتذكرة</button>
                </div>
              `;
            });
          }
        } else {
          container.innerHTML = `<div class="empty-state">فشل في جلب التذاكر: ${result.message || 'خطأ غير معروف'}</div>`;
        }
      } catch (err) {
        console.error(err);
        document.getElementById('ticketsContainer').innerHTML = '<div class="empty-state">تعذر الاتصال بالسيرفر.</div>';
      }
    };
  </script>
</body>
</html>
